# baselines.toml — measured per-system cost at the prototype target.
#
# 1,200 entities, 128x128 map with obstacles, everyone crossing through a
# single gap. Measured over 1,000 ticks after a 200-tick warm-up, release
# build, on the development machine (Windows 11, x86-64).
#
# THESE ARE NOT WHAT CI ENFORCES. Shared runners are noisy, and measurably
# slower — the GitHub runner came in ~29% above this machine on steering. CI
# checks the TECH_SPEC §9 CEILINGS instead, so a failure means something got
# genuinely slower rather than that a neighbour VM was busy. These numbers
# exist to make a local regression legible.

[measured]
date = "2026-08-04"
entities = 1200
map = "128x128"
ticks = 1000

# ms per tick
steering = 1.504          # budget 2.5  — 60%
pathfinding = 0.002       # budget 1.5  —  0.1%
movement_spatial = 0.557  # budget 0.8  — 70%
command_execution = 0.001 # budget 0.4  —  0.2%
total = 2.065             # PRD §4 target 8.0

# --------------------------------------------------------------------------
# What these numbers say
# --------------------------------------------------------------------------
#
# PATHFINDING IS FREE. 0.1% of its budget. Tile A* with a 16-search-per-tick
# cap is nowhere near the ceiling at this scale, which is what resolved
# ADR-012 against building HPA* and flow fields.
#
# STEERING IS THE HOT SPOT and the only system with a real cost, because of
# the three relaxation passes that fixed "mushy" at Feel Checkpoint 1.
#
# It was 2.218 ms here — and 2.865 ms on a CI runner, which BREACHED the
# 2.5 ms budget. The fix was not to drop a pass: that would have traded away
# feel the architect had just approved. The broad-phase query was being redone
# once per unit per PASS when the candidate set does not change within a tick;
# caching it per tick took steering to 1.504 ms, a 32% saving.
#
# The state hash is unchanged by that optimisation (0x504acd51d55aa3ae before
# and after, per `bench_match --verify`), which is the evidence that it was
# waste rather than a behaviour change.
#
# Cost of the relaxation passes, measured before the cache:
#   separation_iterations = 1  ->  0.857 ms
#   separation_iterations = 2  ->  1.359 ms
#   separation_iterations = 3  ->  2.166 ms
#
# If a later phase needs steering headroom, the levers in order of preference:
#   1. Skip later relaxation passes for units that stopped overlapping after
#      the first — most of a crowd resolves in one pass.
#   2. Incremental spatial-hash update instead of a full rebuild per tick
#      (currently in movement+spatial at 70% of its budget).
#   3. Drop to 2 relaxation passes. This one costs FEEL and is the architect's
#      call, not an optimisation to make quietly.
