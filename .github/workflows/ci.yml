# .github/workflows/ci.yml — CI Pipeline v2
# The cross-platform determinism arena (job: determinism) is THE guard.
# All jobs are required checks for merge to main.

name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,      target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm,   target: aarch64-unknown-linux-gnu }
          - { os: windows-latest,     target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test  --workspace --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Invoked via `bash` rather than `./scripts/...` on purpose: the direct
      # form depends on the executable bit surviving the trip through git from
      # a Windows dev machine, where core.filemode is off. It did not, and the
      # first CI run died here with "Permission denied" (exit 126). The mode is
      # now 100755 in the index; running it through bash means a future script
      # added from Windows cannot resurrect this failure. See Ledger gotchas.
      - run: bash ./scripts/ban_floats.sh
      - name: cargo-deny (sim-crate dependency allowlist + advisories)
        uses: EmbarkStudios/cargo-deny-action@v2

  # --------------------------------------------------------------
  # THE GUARD: identical state hashes across three architectures.
  # Catches float leakage, iteration-order entropy, UB divergence —
  # everything grep cannot see. A red here blocks everything.
  # --------------------------------------------------------------
  determinism:
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: x86_64-linux }
          - { os: ubuntu-24.04-arm, name: aarch64-linux }
          - { os: windows-latest,   name: x86_64-windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run headless determinism arena
        # Current arena per phase: see IMPLEMENTATION_PLAN standing rules.
        # 600 mixed-race scripted units, 10,000 ticks, seed 42,
        # hash checkpoints every 1,000 ticks → arena_hashes.txt
        run: cargo run --release --locked -p tools --bin headless_sim -- --arena ci --out arena_hashes_${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arena-${{ matrix.name }}
          path: arena_hashes_${{ matrix.name }}.txt

  determinism-compare:
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: hashes, merge-multiple: true }
      - name: All platforms must agree, bit for bit
        run: |
          cd hashes
          ls -la
          first=$(ls *.txt | head -1)
          for f in *.txt; do
            if ! cmp -s "$first" "$f"; then
              echo "::error::DESYNC BETWEEN PLATFORMS: $first vs $f"
              diff "$first" "$f" || true
              exit 1
            fi
          done
          echo "Determinism verified across all platforms."

# ================================================================
# JOBS BELOW ARE DORMANT UNTIL THE CODE THEY TEST EXISTS.
#
# Each one invokes a binary or test target that is not written yet, so at
# Phase 0 they fail on "no bin target named ..." — a red CI that reports
# nothing about determinism and trains you to ignore red. The Phase 0 exit
# gate (IMPLEMENTATION_PLAN) only demands: workspace builds on 3 platforms,
# empty-state hash identical across them, ban_floats green. That is exactly
# what the jobs above prove.
#
# UNCOMMENT EACH ONE IN ITS OWN PHASE. Do not uncomment early "to have it
# ready" — a permanently-red required check is worse than a missing one.
#   allocation-gate   → Phase 2 (needs tools/tests/alloc_gate.rs + SimState)
#   bench-regression  → Phase 3 (needs tools/src/bin/bench_match.rs +
#                                benches/baselines.toml)
#   map-check         → Phase 6 (needs tools/src/bin/map_check.rs + real maps
#                                under assets/data/maps/)
